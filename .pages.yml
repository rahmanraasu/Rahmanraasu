
media:
  input: images
  output: images

content:
  - name: articles
    label: প্রকাশিত লেখা
    type: collection
    path: content/articles
    format: json
    filename:
      template: "{primary}.json"
      field: create
    fields:
      - name: title
        label: লেখার শিরোনাম
        type: string
        required: true

      - name: author
        label: লেখকের নাম
        type: string
        required: true

      - name: category
        label: বিভাগের নাম
        type: select
        options:
          values:
            - কবিতা
            - গল্প
            - প্রবন্ধ
            - উক্তি
            - বুক রিভিউ
            - উপন্যাস

      - name: body
        label: লেখার মূল অংশ
        type: text
        required: true
